name: Deploy BMS (one environment)

# Reusable: deploys an already-built `bms-dist` artifact to one environment.
# Nothing is built here, so every environment receives the same bytes. The
# only per-environment file is /config.json, written from the inputs below.

on:
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      aws_region: { type: string, required: true }
      deploy_role_arn: { type: string, required: true }
      s3_bucket: { type: string, required: true }
      cloudfront_distribution_id: { type: string, required: true }
      config_json: { type: string, required: true }
      artifact_run_id:
        description: Run that built the artifact (empty = this run)
        type: string
        default: ""
    outputs:
      manifest_sha256:
        description: SHA-256 of the bucket's file list + hashes (config.json excluded)
        value: ${{ jobs.deploy.outputs.manifest_sha256 }}

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-bms-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
    env:
      S3_BUCKET: ${{ inputs.s3_bucket }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: bms-dist
          path: dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Write config.json
        env:
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          test ! -e dist/config.json || { echo "::error::artifact must not contain config.json"; exit 1; }
          echo "$CONFIG_JSON" | jq -e '.region and .userPoolId and .userPoolClientId and .graphqlEndpoint' > /dev/null
          echo "$CONFIG_JSON" | jq . > "$RUNNER_TEMP/config.json"
          cat "$RUNNER_TEMP/config.json"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.deploy_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Upload to S3
        run: |
          # Hashed assets: cache for a year. index.html, build-info.json, favicon, config.json: revalidate.
          # build-info.json must never be cached: open tabs poll it to notice a new deploy.
          aws s3 sync dist/ "s3://$S3_BUCKET/" --delete \
            --exclude index.html --exclude favicon.png --exclude config.json --exclude build-info.json \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws s3 cp dist/build-info.json "s3://$S3_BUCKET/build-info.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json; charset=utf-8"
          aws s3 cp dist/favicon.png "s3://$S3_BUCKET/favicon.png" \
            --cache-control "public,max-age=3600"
          aws s3 cp "$RUNNER_TEMP/config.json" "s3://$S3_BUCKET/config.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront_distribution_id }}" \
            --paths "/*"

      - name: Verify bucket matches the artifact
        id: verify
        run: |
          manifest() { (cd "$1" && find . -type f ! -path ./config.json -print0 | sort -z | xargs -0 sha256sum); }
          aws s3 sync "s3://$S3_BUCKET/" "$RUNNER_TEMP/bucket" --exclude config.json --only-show-errors
          manifest dist > "$RUNNER_TEMP/artifact.sha256"
          manifest "$RUNNER_TEMP/bucket" > "$RUNNER_TEMP/bucket.sha256"
          if ! diff -u "$RUNNER_TEMP/artifact.sha256" "$RUNNER_TEMP/bucket.sha256"; then
            echo "::error::s3://$S3_BUCKET differs from the build artifact"
            exit 1
          fi
          sum=$(sha256sum "$RUNNER_TEMP/bucket.sha256" | cut -d' ' -f1)
          echo "manifest_sha256=$sum" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ inputs.environment }}: s3://$S3_BUCKET"
            echo "Files (excluding config.json): $(wc -l < "$RUNNER_TEMP/bucket.sha256")"
            echo "Manifest SHA-256: \`$sum\`"
          } >> "$GITHUB_STEP_SUMMARY"

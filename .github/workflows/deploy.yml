name: Deploy BMS

# DEV:  every push to main deploys to https://dev.bms.pharmawrk.com.
# PROD: manual only. Actions -> Deploy BMS -> Run workflow -> environment "prod"
#       (from main) deploys to https://prod.bms.pharmawrk.com.
#
# The values below are public identifiers that ship in the browser bundle,
# not secrets. A GitHub environment variable of the same name overrides them.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: DEV
    if: github.event_name == 'push' || inputs.environment == 'dev'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      aws_region: ap-south-1
      deploy_role_arn: arn:aws:iam::875476618141:role/pharmawrk/PharmaWRK-Deploy-bms-dev
      s3_bucket: pharmawrk-web-bms-dev-875476618141
      cloudfront_distribution_id: E2NNIJLHEE8CWX
      user_pool_id: ap-south-1_lc4CPMAp0
      web_client_id: 7s4shkr6lsjs90fnba8mree4i4
      graphql_endpoint: https://tu3vgr25zrf6bagaax6t35a56a.appsync-api.ap-south-1.amazonaws.com/graphql

  deploy-prod:
    name: PROD
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
      aws_region: ap-south-1
      deploy_role_arn: arn:aws:iam::069371693349:role/pharmawrk/PharmaWRK-Deploy-bms-prod
      s3_bucket: pharmawrk-web-bms-prod-069371693349
      cloudfront_distribution_id: E3QV75S632FB11
      user_pool_id: ap-south-1_Y9VTK43qS
      web_client_id: 2c2p7f8lscn8qngo80vuq8b7ip
      graphql_endpoint: https://uqslozlpuvgv5eu2fjks7n7xce.appsync-api.ap-south-1.amazonaws.com/graphql

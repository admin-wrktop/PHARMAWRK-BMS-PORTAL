name: Deploy BMS

# Build once, deploy the same bytes everywhere. The bundle holds no
# environment values; each environment gets its own /config.json only.
#
# Every push to main: build once -> deploy DEV (https://dev.bms.pharmawrk.com)
#   -> if DEV succeeded, deploy the SAME build to PROD (https://prod.bms.pharmawrk.com).
# Manual re-promote: Actions -> Deploy BMS -> Run workflow (branch main) ->
#   environment "prod". It does NOT rebuild: it deploys the artifact from the
#   latest successful push run on main (or the run id you give).
#
# config.json values are public identifiers that ship to the browser anyway.
# "features" switches screens per environment without changing the build:
# turn a feature on for PROD here once its backend is live there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
      artifact_run_id:
        description: "PROD only: run id whose build to deploy (empty = latest successful DEV deploy on main)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    name: Build
    if: github.event_name == 'push' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (no environment values)
        run: |
          npm run build
          rm -f dist/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: bms-dist
          path: dist
          retention-days: 90
          if-no-files-found: error

  deploy-dev:
    name: DEV
    needs: build
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      aws_region: ap-south-1
      deploy_role_arn: arn:aws:iam::875476618141:role/pharmawrk/PharmaWRK-Deploy-bms-dev
      s3_bucket: pharmawrk-web-bms-dev-875476618141
      cloudfront_distribution_id: E2NNIJLHEE8CWX
      config_json: >-
        {"region":"ap-south-1",
        "userPoolId":"ap-south-1_lc4CPMAp0",
        "userPoolClientId":"7s4shkr6lsjs90fnba8mree4i4",
        "graphqlEndpoint":"https://tu3vgr25zrf6bagaax6t35a56a.appsync-api.ap-south-1.amazonaws.com/graphql",
        "esperConsoleUrl":"${{ vars.VUE_APP_ESPER_CONSOLE_URL }}",
        "features":{"supportCases":true,"latLng":true}}

  pick-prod-build:
    name: Pick build for PROD
    needs: deploy-dev
    # Push: right after DEV succeeds, with this run's build.
    # Manual "prod": a previous push run's build.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.deploy-dev.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.pick.outputs.run_id }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIVEN: ${{ inputs.artifact_run_id }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            run_id="${{ github.run_id }}"
          elif [ -n "$GIVEN" ]; then
            run_id="$GIVEN"
          else
            run_id=$(gh run list --workflow deploy.yml --branch main --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$run_id" ] || { echo "::error::No successful DEV deploy found to promote"; exit 1; }
          sha=$(gh run view "$run_id" --json headSha --jq .headSha)
          echo "Promoting build from run $run_id (commit $sha)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: PROD
    needs: pick-prod-build
    if: always() && needs.pick-prod-build.result == 'success'
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
      aws_region: ap-south-1
      deploy_role_arn: arn:aws:iam::069371693349:role/pharmawrk/PharmaWRK-Deploy-bms-prod
      s3_bucket: pharmawrk-web-bms-prod-069371693349
      cloudfront_distribution_id: E3QV75S632FB11
      artifact_run_id: ${{ needs.pick-prod-build.outputs.run_id }}
      config_json: >-
        {"region":"ap-south-1",
        "userPoolId":"ap-south-1_Y9VTK43qS",
        "userPoolClientId":"2c2p7f8lscn8qngo80vuq8b7ip",
        "graphqlEndpoint":"https://uqslozlpuvgv5eu2fjks7n7xce.appsync-api.ap-south-1.amazonaws.com/graphql",
        "esperConsoleUrl":"${{ vars.VUE_APP_ESPER_CONSOLE_URL }}",
        "features":{"supportCases":false,"latLng":false}}
